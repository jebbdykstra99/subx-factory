name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13.18' }
      - name: Python version (the drift checker is tested on this exact version)
        run: python3 --version
      - run: npm install --no-audit --no-fund
      - run: node --check factory/factory.js && node --check factory/factory-gp.js && node --check factory/factory-rail.js && node --check factory/factory-reports.js
      - run: npx eslint --no-eslintrc -c .eslintrc.json factory/factory.js factory/factory-gp.js factory/factory-rail.js factory/factory-reports.js
      - name: Core byte budget (<= 265000 B; v1.2.9 sign-in fix)
        run: tools/check_budget.sh
      - run: node test/nest-feed.test.js
      - run: node test/notifs-reports.test.js
      - run: node test/report-loop.test.js
      - name: No inline Firebase web key (Sep 25 secret-scan lock)
        run: "! grep -n 'AIza' factory/factory.js factory/factory-gp.js factory/factory-rail.js factory/factory-reports.js"
      - name: rebuild --check names every differing file
        run: bash test/rebuild-check.test.sh
      - name: Rebuild is reproducible
        run: build/rebuild.sh --check
      - run: python3 -c "import json; json.load(open('rooms.json'))"
      - name: whoMark disclosure mark (assets/whomark in sync, unit + swap tests)
        run: python3 build/whomark.py --check --no-png && node test/whomark.test.js
      - name: Shared pinned shell (shell/v*/ match SHELL.json; drift checker tests)
        run: python3 test/shell_pin.test.py
      - name: Hub (subx.it) renders from brand/brand.json; rename test; strict CSP; shell_drift OK
        run: python3 tools/brand_render.py --check && python3 test/hub_brand.test.py && python3 test/hub_social.test.py
      - name: Stories module (shell v1.2.7 default-on + text-only gate + hub hand-off; stories.json schema)
        run: python3 test/stories_module.test.py
      - name: Hub WHOMARK final-v4.1 (config, asset MD5s, titles, label rule, legend, banned names)
        run: python3 test/whomark_hub.test.py
      - name: Author byline allowlist (By Jebb Dykstra passes; operator/meta/JSON-LD fail)
        run: python3 test/byline_allow.test.py
      - name: Topics layer (seed + schema, slug rules, activity rule, hybrid domain config; dry run only)
        run: python3 tools/topics_seed.py --check && python3 tools/topic_domains.py --check && python3 test/topics.test.py
      - name: Spin-up dry run (site.json for the candidate domains; temp dir only, drift --strict + domain validator)
        run: python3 tools/spinup_render.py --check && python3 test/spinup.test.py
  rules-hub:
    # Hub sign-in Firestore rules (rules/firestore.rules.hub-signin.proposed and its .dm-on twin)
    # against the local Firestore emulator. Demo project id only: no real project, no credentials, no secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Install rules test deps (firebase-tools, rules-unit-testing)
        working-directory: rules/tests
        run: npm install --no-audit --no-fund
      - name: Hub sign-in rules, hub DM toggle OFF (shipped file)
        working-directory: rules/tests
        run: npm run test:hub
      - name: Hub sign-in rules, hub DM toggle ON (.dm-on file)
        working-directory: rules/tests
        run: npm run test:hub:dm-on
