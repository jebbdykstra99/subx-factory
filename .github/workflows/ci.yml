name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: node --check factory/factory.js
      - run: npx eslint --no-eslintrc -c .eslintrc.json factory/factory.js
      - run: node test/nest-feed.test.js
      - name: No inline Firebase web key (Sep 25 secret-scan lock)
        run: "! grep -n 'AIza' factory/factory.js"
      - name: Rebuild is reproducible
        run: build/rebuild.sh --check
      - run: python3 -c "import json; json.load(open('rooms.json'))"
