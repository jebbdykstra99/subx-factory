# Shared SubX room smoke test (synced from subx-factory templates/room). Free GitHub Actions minutes
# (public repo). Read-only: no secrets, no deploy, no writes.
name: smoke
on:
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: smoke-${{ github.ref }}, cancel-in-progress: true }
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: tests/smoke } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: tests/smoke/test-results, retention-days: 7 }
